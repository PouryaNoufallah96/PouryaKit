name: Package publication

on:
  workflow_call:
    inputs:
      run_id:
        required: true
        type: string
      run_attempt:
        required: true
        type: string
      source_sha:
        required: true
        type: string
      source_event:
        required: true
        type: string

permissions:
  contents: read
  actions: read
  packages: write

jobs:
  publish:
    if: github.repository == 'PouryaNoufallah96/PouryaKit' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    concurrency:
      group: pouryakit-private-publication
      cancel-in-progress: false
    permissions:
      contents: read
      actions: read
      packages: write
    steps:
      # Publisher code comes from trusted main, never from the downloaded artifact.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: actions/setup-dotnet@v6

      - name: Download original validated packages
        uses: actions/download-artifact@v8
        with:
          name: package-validation-${{ inputs.run_id }}-${{ inputs.run_attempt }}
          run-id: ${{ inputs.run_id }}
          repository: PouryaNoufallah96/PouryaKit
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/publication
          digest-mismatch: error

      - name: Verify original validation artifact
        env:
          ORIGINAL_RUN: ${{ inputs.run_id }}
          ORIGINAL_ATTEMPT: ${{ inputs.run_attempt }}
          ORIGINAL_SHA: ${{ inputs.source_sha }}
          ORIGINAL_EVENT: ${{ inputs.source_event }}
          PACKAGES_DIR: ${{ runner.temp }}/publication
        shell: bash
        run: |
          set -euo pipefail
          jq -e --arg sha "$ORIGINAL_SHA" --arg run "$ORIGINAL_RUN" --arg attempt "$ORIGINAL_ATTEMPT" --arg event "$ORIGINAL_EVENT" '
            .repository == "PouryaNoufallah96/PouryaKit" and .ref == "refs/heads/main" and
            .event == $event and .tested_sha == $sha and .run_id == $run and .run_attempt == $attempt and
            .shallow == false and .pull_request == null and .validation_result == "success" and
            .manifest == "manifest.json" and .artifact_name == ("package-validation-" + $run + "-" + $attempt)
          ' "$PACKAGES_DIR/validation.json" > /dev/null
          version=$(jq -er '.version' "$PACKAGES_DIR/validation.json")
          jq -e --arg sha "$ORIGINAL_SHA" --arg version "$version" '
            .commit == $sha and .version == $version and
            ($version | test("^0\\.[0-9]+\\.[0-9]+-(preview|rc)(\\.[0-9A-Za-z-]+)*$")) and
            all(.packages[]; .file == (.id + "." + $version + ".nupkg") and (.sha256 | test("^[0-9a-f]{64}$")))
          ' "$PACKAGES_DIR/manifest.json" > /dev/null
          diff <(jq -r '.packages[].id' scripts/packaging/inventory.json | sort) \
               <(jq -r '.packages[].id' "$PACKAGES_DIR/manifest.json" | sort)
          diff <(jq -r '.packages[].file' "$PACKAGES_DIR/manifest.json" | sort) \
               <(printf '%s\n' "$PACKAGES_DIR/packages/"*.nupkg | sed 's|.*/||' | sort)
          jq -r '.packages[] | .sha256 + "  packages/" + .file' "$PACKAGES_DIR/manifest.json" > "$RUNNER_TEMP/package-checksums.txt"
          (cd "$PACKAGES_DIR" && sha256sum --check "$RUNNER_TEMP/package-checksums.txt")
          echo "Validated main SHA: $ORIGINAL_SHA. MinVer version: $version." >> "$GITHUB_STEP_SUMMARY"

      - name: Push original packages and prove each from the feed
        env:
          GITHUB_TOKEN: ${{ github.token }}
          NuGetPackageSourceCredentials_GitHub: Username=${{ github.actor }};Password=${{ github.token }};ValidAuthenticationTypes=Basic
          PACKAGES_DIR: ${{ runner.temp }}/publication
        shell: bash
        run: |
          set -euo pipefail
          test -n "$GITHUB_TOKEN"
          cat > "$RUNNER_TEMP/publication.NuGet.Config" <<'XML'
          <configuration>
            <packageSources>
              <clear />
              <add key="GitHub" value="https://nuget.pkg.github.com/PouryaNoufallah96/index.json" />
              <add key="nuget.org" value="https://api.nuget.org/v3/index.json" />
            </packageSources>
            <packageSourceMapping>
              <packageSource key="GitHub"><package pattern="PouryaKit.*" /></packageSource>
              <packageSource key="nuget.org"><package pattern="*" /></packageSource>
            </packageSourceMapping>
          </configuration>
          XML
          while IFS= read -r filename; do
            dotnet nuget push "$PACKAGES_DIR/packages/$filename" \
              --source GitHub --api-key "$GITHUB_TOKEN" --skip-duplicate --no-symbols \
              --configfile "$RUNNER_TEMP/publication.NuGet.Config"
          done < <(jq -r '.packages[].file' "$PACKAGES_DIR/manifest.json")
          version=$(jq -er '.version' "$PACKAGES_DIR/manifest.json")
          consumer=$(mktemp -d "$RUNNER_TEMP/private-consumer.XXXXXX")
          export NUGET_HTTP_CACHE_PATH="$consumer/http-cache" NUGET_PLUGINS_CACHE_PATH="$consumer/plugin-cache"
          # A library package is referenced at its exact version; a package of inventory kind "template" is installed instead.
          {
            echo '<Project Sdk="Microsoft.NET.Sdk"><PropertyGroup><TargetFramework>net10.0</TargetFramework></PropertyGroup><ItemGroup>'
            jq -r --arg version "$version" '.packages[] | select(.kind != "template") | "<PackageReference Include=\"" + .id + "\" Version=\"[" + $version + "]\" />"' scripts/packaging/inventory.json
            echo '</ItemGroup></Project>'
          } > "$consumer/Consumer.csproj"
          dotnet restore "$consumer/Consumer.csproj" --packages "$consumer/packages" \
            --configfile "$RUNNER_TEMP/publication.NuGet.Config"
          proven="every library package referenced at $version"
          # The feed's side of the template consumers in scripts/packaging/validate.py, which install the produced nupkg instead.
          # dotnet new install reads the NuGet.Config of its working folder, credentials included, and ignores source mapping:
          # that copy keeps the GitHub source alone.
          mkdir "$consumer/templates"
          cp "$RUNNER_TEMP/publication.NuGet.Config" "$consumer/templates/NuGet.Config"
          dotnet nuget disable source nuget.org --configfile "$consumer/templates/NuGet.Config"
          template_packages=$(jq -r '.packages[] | select(.kind == "template") | .id' scripts/packaging/inventory.json)
          for id in $template_packages; do
            (cd "$consumer/templates" && dotnet new install "$id@$version" --debug:custom-hive "$consumer/hive")
            proven="$proven; $id installed"
            short_names=$(jq -er '.shortName' "src/$id/content/"*/.template.config/template.json)
            for template in $short_names; do
              # The two name shapes of #59: a dotted name, and one a namespace cannot hold, kept as typed in paths.
              for name in Acme.Shop acme-shop; do
                (cd "$consumer/templates" && dotnet new "$template" -n "$name" -o "$template/$name" --no-restore --debug:custom-hive "$consumer/hive")
                dotnet restore "$consumer/templates/$template/$name/$name.slnx" --packages "$consumer/packages" \
                  --configfile "$RUNNER_TEMP/publication.NuGet.Config"
                proven="$proven; dotnet new $template -n $name generated and restored"
              done
            done
          done
          echo "NuGet push completed, then from the feed with fresh caches: $proven. HTTP 409 duplicates are skipped; remote byte identity is not verified." >> "$GITHUB_STEP_SUMMARY"
