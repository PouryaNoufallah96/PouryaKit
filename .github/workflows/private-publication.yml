name: Private main publication

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      run_id:
        description: Original successful main CI run ID
        required: true
        type: string
      run_attempt:
        description: Original successful validation attempt
        required: true
        type: string
      source_sha:
        description: Exact original main source SHA
        required: true
        type: string

permissions:
  contents: read

jobs:
  authorize:
    if: >-
      github.repository == 'PouryaNoufallah96/PouryaKit' && github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
      (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'workflow_dispatch') &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.repository.full_name == github.repository))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      source_event: ${{ steps.authorize.outputs.source_event }}
    steps:
      - name: Require successful trusted main validation
        id: authorize
        uses: actions/github-script@v9
        env:
          ORIGINAL_RUN: ${{ github.event_name == 'workflow_run' && format('{0}', github.event.workflow_run.id) || inputs.run_id }}
          ORIGINAL_ATTEMPT: ${{ github.event_name == 'workflow_run' && format('{0}', github.event.workflow_run.run_attempt) || inputs.run_attempt }}
          ORIGINAL_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || inputs.source_sha }}
        with:
          script: |
            const { ORIGINAL_RUN: id, ORIGINAL_ATTEMPT: attempt, ORIGINAL_SHA: sha } = process.env;
            if (!/^[1-9][0-9]*$/.test(id) || !/^[1-9][0-9]*$/.test(attempt) || !/^[0-9a-f]{40}$/.test(sha)) {
              throw new Error('An original run ID, attempt and exact SHA are required.');
            }
            const repository = 'PouryaNoufallah96/PouryaKit';
            const { data: repo } = await github.rest.repos.get(context.repo);
            const { data: run } = await github.rest.actions.getWorkflowRunAttempt({
              ...context.repo, run_id: id, attempt_number: attempt
            });
            if (repo.full_name !== repository || repo.private !== true || repo.default_branch !== 'main' ||
                String(run.id) !== id || String(run.run_attempt) !== attempt ||
                run.status !== 'completed' || run.conclusion !== 'success' ||
                !['push', 'workflow_dispatch'].includes(run.event) ||
                run.head_branch !== 'main' || run.head_sha !== sha ||
                run.path !== '.github/workflows/ci.yml' ||
                run.repository?.full_name !== repository || run.head_repository?.full_name !== repository) {
              throw new Error('Publication requires the exact successful private-repository main CI attempt.');
            }
            const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRunAttempt, {
              ...context.repo, run_id: id, attempt_number: attempt, per_page: 100
            });
            for (const name of ['ai-setup', 'build-and-test / validate']) {
              const matches = jobs.filter(job => job.name === name);
              if (matches.length !== 1 || matches[0].status !== 'completed' || matches[0].conclusion !== 'success') {
                throw new Error('AI and package validation jobs must have succeeded.');
              }
            }
            core.setOutput('source_event', run.event);
            core.info(`Authorized main CI ${id}, attempt ${attempt}, SHA ${sha}.`);

  publish:
    needs: authorize
    permissions:
      contents: read
      actions: read
      packages: write
    uses: ./.github/workflows/package-publication.yml
    with:
      run_id: ${{ github.event_name == 'workflow_run' && format('{0}', github.event.workflow_run.id) || inputs.run_id }}
      run_attempt: ${{ github.event_name == 'workflow_run' && format('{0}', github.event.workflow_run.run_attempt) || inputs.run_attempt }}
      source_sha: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || inputs.source_sha }}
      source_event: ${{ needs.authorize.outputs.source_event }}
