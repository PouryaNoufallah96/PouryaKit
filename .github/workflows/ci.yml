name: CI

on:
  push:
    branches: [main, 'feat/**', 'wave-**']
    tags: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ai-setup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # The full history: the docs check resolves the revision each architecture diagram pins.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      # The check needs Python 3.11 or later (tomllib).
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      # The check hashes the vendored skills in JavaScript's string order (check-skills-lock.mjs).
      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      - run: python3 .agents/scripts/check-ai-setup.py
      - run: python3 .agents/scripts/check-docs.py
      - run: python3 -m unittest discover -s .agents/scripts -p 'test_*.py'

  # CSharpier is pinned in .config/dotnet-tools.json. Migrations and the docs site are ignored.
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@v6

      - run: dotnet tool restore
      - run: dotnet csharpier check .

  build-and-test:
    permissions:
      contents: read
    uses: ./.github/workflows/package-validation.yml

  # The docs site: install from the committed lockfile (install scripts only for pnpm-workspace.yaml's allowBuilds),
  # check every npm package's licence, run the site's tests (`pnpm --dir website test`), lint, and build the static
  # export, which generates the pages it renders from the Kit's sources and fails when out/ carries anything private
  # (website/lib/kit-sources/). Then typeset the covers, fail when that render differs from the committed src/icon.png
  # (each nupkg packs the committed file and the public repository the render), and regenerate the public repository's
  # tree, which fails when any file differs from website/distribution/manifest.sha256 (website/scripts/sync-public.ts).
  website:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # pnpm's version comes from the packageManager field of website/package.json.
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: website/package.json

      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      - run: pnpm --dir website install --frozen-lockfile
      - run: pnpm --dir website check-licences
      - run: pnpm --dir website test
      - run: pnpm --dir website lint
      - run: pnpm --dir website build
      - run: pnpm --dir website covers
      - run: git diff --exit-code -- src/icon.png
      - run: pnpm --dir website sync-public --check
