name: CI

on:
  push:
    branches: [main, 'feat/**', 'wave-**']
    tags: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ai-setup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # The full history: the docs check resolves the revision each architecture diagram pins.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      # The check needs Python 3.11 or later (tomllib).
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      # The check hashes the vendored skills in JavaScript's string order (check-skills-lock.mjs).
      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      - run: python3 .agents/scripts/check-ai-setup.py
      - run: python3 .agents/scripts/check-docs.py
      - run: python3 -m unittest discover -s .agents/scripts -p 'test_*.py'

  build-and-test:
    permissions:
      contents: read
    uses: ./.github/workflows/package-validation.yml

  # The docs site: install from the committed lockfile (install scripts only for pnpm-workspace.yaml's allowBuilds),
  # check every npm package's licence, run the site's tests (`pnpm --dir website test`), lint, and build the static export.
  website:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # pnpm's version comes from the packageManager field of website/package.json.
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: website/package.json

      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      - run: pnpm --dir website install --frozen-lockfile
      - run: pnpm --dir website check-licences
      - run: pnpm --dir website test
      - run: pnpm --dir website lint
      - run: pnpm --dir website build
