name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ai-setup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # The check needs Python 3.11 or later (tomllib).
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - run: python3 .agents/scripts/check-ai-setup.py

  build-and-test:
    permissions:
      contents: read
    uses: ./.github/workflows/package-validation.yml
