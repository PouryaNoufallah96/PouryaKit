name: CI

on:
  push:
    branches: [main, 'feat/**']
    tags: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ai-setup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # The check needs Python 3.11 or later (tomllib).
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      # The check hashes the vendored skills in JavaScript's string order (check-skills-lock.mjs).
      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      - run: python3 .agents/scripts/check-ai-setup.py
      - run: python3 .agents/scripts/check-docs.py
      - run: python3 -m unittest discover -s .agents/scripts -p 'test_*.py'

  build-and-test:
    permissions:
      contents: read
    uses: ./.github/workflows/package-validation.yml

  publication-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Check publication trust and original artifacts
        run: python3 -m unittest discover -s tests/releases/publication -p 'test_*.py'
