#:schema https://developers.openai.com/codex/config-schema.json
# Project config for PouryaKit. Codex loads it only when this repository is trusted in
# ~/.codex/config.toml. Sandbox and approval policy stay with the user's own config.

model = "gpt-6-astra"
model_reasoning_effort = "high"
# `codex review` uses review_model. `codex exec`, including /kit-review when codexModel is omitted, uses model and model_reasoning_effort above.
review_model = "gpt-6-astra"

[agents]
# Fallback for a spawned agent that is not one of the three roles. Those pin model and effort in .codex/agents.
default_subagent_model = "gpt-6.1-sol"
default_subagent_reasoning_effort = "high"

[shell_environment_policy.set]
# The same key as .claude/settings.json: docs/agents/ai-setup.md, "An agent's shell and the SDK".
MISE_AUTO_INSTALL_DISABLE_TOOLS = "dotnet"
